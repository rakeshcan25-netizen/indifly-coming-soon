<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b0b">
  <meta name="description" content="IndiFly is creating a more extraordinary way to discover the world. A new chapter in global opportunity, travel and experience is coming soon.">
  <title>IndiFly — Beyond the Expected</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/script.js" defer></script>
</head>
<body>
  <main class="hero" aria-label="IndiFly coming soon">
    <video class="hero__video" autoplay muted loop playsinline preload="metadata" poster="assets/hero-fallback.svg" aria-hidden="true">
      <source src="https://videos.pexels.com/video-files/3129671/3129671-hd_1920_1080_25fps.mp4" type="video/mp4">
    </video>
    <div class="hero__veil" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="hero__frame" aria-hidden="true"></div>

    <header class="brand" aria-label="IndiFly">
      <span class="brand__mark" aria-hidden="true">I</span>
      <span class="brand__name">INDIFLY</span>
    </header>

    <section class="message">
      <p class="eyebrow"><span></span> THE ART OF GOING FURTHER <span></span></p>
      <h1>The world is yours<br><em>to go beyond.</em></h1>
      <p class="intro">New horizons. Remarkable opportunities.<br class="desktop-break"> Experiences that stay with you.</p>
      <blockquote class="quote">“The extraordinary begins where the familiar ends.”</blockquote>
      <div class="rule" aria-hidden="true"><span></span><i></i><span></span></div>
      <p class="coming"><span class="coming__dot" aria-hidden="true"></span> COMING SOON <span class="coming__dot" aria-hidden="true"></span></p>
    </section>

    <div class="bottom-note" aria-hidden="true"><span>BEYOND THE EXPECTED</span><span class="bottom-note__line"></span><span>A NEW CHAPTER AWAITS</span></div>
    <button class="motion-toggle" type="button" aria-label="Pause background motion" title="Pause background motion">
      <span class="motion-toggle__icon" aria-hidden="true">Ⅱ</span>
    </button>
  </main>
</body>
</html>
